# ThinForge — Registry-basiertes Compose
#
# Zieht die vorgebauten Container-Images aus der Gitea-Registry statt lokal
# aus dem Source zu bauen. Spart den Rust-/Go-/Vue-Build (~10 Min) beim
# Erst-Deploy auf neuen Hosts.
#
# Voraussetzungen:
#   1. docker login git.thinforge.org -u <user> (einmal pro Host)
#      HTTPS auf Standardport — kein insecure-registries-Eintrag nötig.
#   2. Das Repo ist trotzdem geklont — Volumes wie ./ansible, ./scripts,
#      ./agent-go/bin oder ./migrations werden
#      weiterhin in Container gemountet. Das Image enthält nur die
#      Runtime-Binaries. (./docker/grafana/provisioning und
#      ./docker/prometheus/prometheus.yml erst wieder, wenn Prometheus und
#      Grafana reaktiviert sind — unten auskommentiert.)
#
# Verwendung:
#   docker compose up -d
#   docker compose --profile network up -d
#   docker compose --profile monitoring up -d
#     (derzeit ohne Dienste — Prometheus/Grafana sind ausgebaut)

name: thinforge

# Anchor für alle Bridge-Network-Services: neutralisiert die search-domain
# aus host /etc/resolv.conf. Sonst expandiert Docker's embedded DNS jeden
# Container-Namen ohne Punkt (`backend`, `redis`, ...) via search-domain
# und resolved auf einen externen Wildcard-CNAME (z. B. *.thinforge.org
# → 203.0.113.10) STATT auf die Container-IP. Folge: Caddy → 502 backend
# unreachable, Backend → kein Redis, etc. Setzt search auf `.` (root) →
# Docker-DNS kann Container-Hostnamen direkt aufloesen, vollstaendig dynamisch.
x-no-search-domain: &no-search-domain
  dns_search:
    - .

# Protokollgrenze fuer JEDEN Dienst (`logging: *default-logging`): Docker
# behaelt je Container hoechstens drei Dateien zu 50 MB und verwirft danach
# die aeltesten Zeilen. Bis 2026-10-09 hatten nur backend und worker eine
# Grenze; alle anderen schrieben ohne, sofern der Docker-Dienst des Hosts
# (/etc/docker/daemon.json) keine vorgab — darunter dnsmasq, das jede
# DHCP-Vergabe und auf Wunsch jede DNS-Anfrage protokolliert. Siehe
# docker-compose.yml; der Test `compose::tests::jeder_dienst_begrenzt_seine_protokolle`
# prueft beide Dateien.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "3"

services:
  postgres:
    labels:
      com.thinforge.label: "PostgreSQL"
      com.thinforge.icon: "mdi-database"
      com.thinforge.critical: "true"
    <<: *no-search-domain
    # Offizielles Docker-Hub-Abbild. In der Dev-Compose lief bis 2026-10-26
    # lief hier reg.mini.dev/postgres:18 (Minimus, glibc); Minimus hat den
    # Betrieb eingestellt und die Registry am 2026-10-22 abgeschaltet.
    # musl statt glibc: eine Datenbank, die unter dem Minimus-Abbild lief,
    # sortiert Text anders, ihre Textindizes passen nicht mehr. thinforge-migrate
    # baut sie beim ersten Start von Backend/Worker neu auf (Protokollzeile
    # „Collation der Datenbank …"), bevor etwas schreibt. Der Einstieg startet
    # als root und gibt PGDATA dem postgres-Benutzer des Abbilds (uid 70, bei
    # Minimus 999). Tag `18-alpine` folgt der 18.x-Linie.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # postgres:18-alpine setzt PGDATA default auf /var/lib/postgresql/18/docker
      # und deklariert VOLUME /var/lib/postgresql — ein Bind auf /data läuft dann
      # ins Leere, Daten landen in einem anonymen Volume und sind bei rebuilds
      # verloren. Explizit auf Subordner des Bind-Mounts setzen.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${STORAGE_DIR:-./ThinForgeDaten}/postgres:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  redis:
    labels:
      com.thinforge.label: "Redis"
      com.thinforge.icon: "mdi-memory"
      com.thinforge.critical: "true"
    <<: *no-search-domain
    # Offizielles Docker-Hub-Abbild (in der Dev-Compose bis 2026-10-26
    # reg.mini.dev/redis:8, Minimus; die Registry ist abgeschaltet). Bringt
    # redis-cli fuer den Healthcheck unten mit (Passwort ueber REDISCLI_AUTH,
    # siehe environment). Kein Volume (nur Cache): beim Wechsel des Abbilds
    # wird nichts uebernommen, und seine uid (999) spielt keine Rolle.
    image: redis:8-alpine
    restart: unless-stopped
    # Authentifizierung ist Pflicht (Review 2026-09-02 S5-1): die
    # network_mode:host-Dienste teilen sich das Host-Loopback; ohne Passwort
    # schriebe jeder von ihnen Auftraege in die Liste, die der Worker als
    # root auf den Thinclients ausfuehrt. `:?` laesst den Stack OHNE Passwort
    # laut scheitern statt still ohne Auth zu starten. deploy.sh traegt die
    # Variable auf bestehenden Installationen nach (scripts/lib-env.sh).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD fehlt in .env — deploy.sh traegt sie nach}"]
    environment:
      # Fuer den Healthcheck: redis-cli liest das Passwort aus dieser
      # Variablen (nicht `-a` auf der Kommandozeile).
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD fehlt in .env — deploy.sh traegt sie nach}
    # Kein veroeffentlichter Port: Backend und Worker erreichen Redis ueber
    # das Compose-Netz (`redis`). Der Dev-Stack behaelt 127.0.0.1:6379 fuer
    # Tests; im Release-Betrieb braucht es den Host-Port nicht.
    healthcheck:
      # `-e` ist Pflicht: ohne es druckt `redis-cli ping` gegen einen
      # requirepass-Server `NOAUTH` und beendet sich trotzdem mit 0 — der
      # Container gaelte als gesund.
      test: ["CMD", "redis-cli", "-e", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  backend:
    labels:
      com.thinforge.label: "Backend (API)"
      com.thinforge.icon: "mdi-api"
      com.thinforge.critical: "true"
    <<: *no-search-domain
    image: git.thinforge.org/thinforge/thinforge-backend:release
    command: ["thinforge-api"]
    # Bind to 127.0.0.1 only — Caddy:80 reverse-proxiet /api/* fuer
    # PXE-Clients (HTTP, kein TLS-Trust). See F-CR-06.
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      # Groesse des API-Pools (leer = Vorgabe 50/10, crates/thinforge-core/
      # src/config.rs); Summe mit Worker und Migrator gegen Postgres
      # max_connections halten. Bis Runde 5 reichte Compose die beiden nicht
      # durch — ein Wert in .env blieb wirkungslos.
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-}
      DB_MIN_CONNECTIONS: ${DB_MIN_CONNECTIONS:-}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD fehlt in .env — deploy.sh traegt sie nach}@redis:6379/0
      STORAGE_DIR: /data
      TFTP_ROOT: /var/lib/tftpboot
      SIGNING_KEY_DIR: /data/keys
      # Services-Panel-Filter (compose::enabled_profiles_from_env) — Paritaet
      # zum Dev-Compose. Fehlte bis 2026-09-23: auf Release-Hosts galt immer die
      # Vorgabe, ein eigener Wert in .env blieb wirkungslos (Review 2026-09-02,
      # B1). Leer = Vorgabe (network,monitoring,testing,cloner,bittorrent,
      # multicast); deploy.sh zieht nur seinen Standard nach.
      THINFORGE_ENABLED_PROFILES: ${THINFORGE_ENABLED_PROFILES:-}
      # Persist grype's vulnerability DB (~430 MB) across container restarts.
      # Without this, every UI-triggered scan re-downloads the DB (~8 min).
      GRYPE_DB_CACHE_DIR: /data/grype-cache
      # syft und grype ohne ihre eigene Update-Pruefung (toolbox-data.anchore.io);
      # der Scan setzt das beim Aufruf auch selbst (vulnerability_scan.rs).
      GRYPE_CHECK_FOR_APP_UPDATE: "false"
      SYFT_CHECK_FOR_APP_UPDATE: "false"
      # CVE-Exposure-Filter: local = nur gebundelte Acceptance-Liste,
      # remote = nach jedem Scan (im Nachlauf) die Remote-Version pruefen; das
      # Panel liest nur diesen Zwischenstand, es fragt selbst nicht nach.
      # Vorgabe local, also kein Abruf von git.thinforge.org.
      THINFORGE_ACCEPTANCE_LIST_MODE: ${THINFORGE_ACCEPTANCE_LIST_MODE:-local}
      THINFORGE_ACCEPTANCE_LIST_URL: ${THINFORGE_ACCEPTANCE_LIST_URL:-}
      # KEV-Katalog fuer die Relevanz-Spalte: leer = aus (Vorgabe, kein Abruf
      # von cisa.gov); einschalten mit einer HTTPS-Adresse in der .env.
      THINFORGE_KEV_URL: ${THINFORGE_KEV_URL:-}
      # Agent-Build im Backend deaktiviert — genutzt wird nur die mit dem
      # Release-Repo in agent-go/bin/ ausgelieferte Binary. Vorsigniert ist sie
      # nicht: Signaturen sind je Server (eigener Minisign-Schluessel), eine
      # .minisig wird nie mitgeliefert. Das Backend prueft die Signatur bei
      # jedem Start und signiert nach, wenn sie nicht passt — ./deploy.sh
      # startet es nach jedem Pull neu. Bleibt die Binary trotzdem unsigniert
      # (kein Signierschluessel, minisign scheitert; Grund im Backend-Log),
      # nimmt das Backend agent-version zurueck, Clients → Agent zeigt „Nicht
      # signiert", und Tools-ISO-Bau und VM-Start antworten mit 409
      # (toolsIsoAgentBinaryUnsigned bzw. toolsIsoAgentSignatureInvalid) —
      # dann dort „Signieren". POST /agent/build liefert 403, und der
      # First-Login-Auto-Build-Trigger ist ein No-Op.
      THINFORGE_AGENT_BUILD_ENABLED: "false"
      DEBUG: "false"
      # Guacamole-Daemon (Remote-Desktop, Spec 2026-05-14)
      GUACD_HOST: guacd
      GUACD_PORT: "4822"
      # Bild-Kanal an die von cloningvm_service.rs gestarteten
      # `docker compose`-Subprozesse (gemountete /docker-compose.yml)
      # durchreichen. Diese Compose nennt die Abbilder fest mit :release, die
      # Variable ist hier nur der Gleichlauf mit der Registry-Compose.
      THINFORGE_TAG: ${THINFORGE_TAG:-release}
    volumes:
      - ${STORAGE_DIR:-./ThinForgeDaten}:/data
      - ${STORAGE_DIR:-./ThinForgeDaten}/dnsmasq:/etc/dnsmasq.d
      - ${STORAGE_DIR:-./ThinForgeDaten}/tftp:/var/lib/tftpboot
      - ${STORAGE_DIR:-./ThinForgeDaten}/bittorrent:/data/bittorrent
      - ${STORAGE_DIR:-./ThinForgeDaten}/nfs-config:/data/nfs-config
      - ./license:/app/license
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/docker-compose.yml:ro
      # `:ro` bewusst: das Backend muss `.env` nur lesen (Subprozesse
      # `compose --env-file /.env` in cloning/cloningvm). ENCRYPTION_KEY
      # lebt seit der Refaktur in ${STORAGE_DIR}/.encryption_key — keine
      # Host-File-Schreibrechte aus dem Container heraus.
      - ./.env:/.env:ro
      - ./ansible:/ansible:ro
      - ./scripts:/scripts:ro
      # Curated CVE-Acceptance-Liste — wird nach jedem UI-getriggerten Scan
      # von thinforge-services::vulnerability_acceptance gelesen, um
      # REPORT.json mit Verdict (PASS/INFO/WARN) zu schreiben.
      - ./docs/security/vulnerability-acceptance.md:/docs/security/vulnerability-acceptance.md:ro
      # Container-Exposure-Overrides fuer den VEX-Evaluator (Spec 2026-04-21).
      - ./docs/security/container-exposure.yaml:/docs/security/container-exposure.yaml:ro
      # Cache fuer den Remote-Version-Check der Akzeptanzliste.
      - acceptance_cache:/app/cache
      # Backend writes .minisig next to the agent binary during
      # signing/generate-keypair, rotate-key and sign-existing flows, and at
      # startup when the existing signature no longer matches.
      - ./agent-go/bin:/app/agent-go/bin
      # SBOM / vulnerability reports produced by
      # thinforge_services::vulnerability_scan::run_scan (UI-triggered only,
      # via backend). Backend both reads and writes. Host path lives under
      # ThinForgeDaten so storage-dir overrides apply uniformly.
      - ${STORAGE_DIR:-./ThinForgeDaten}/vulnerability-scans/grype:/app/sbom_grype
      - ${STORAGE_DIR:-./ThinForgeDaten}/vulnerability-scans/sbom:/app/sbom
      - /etc/hostname:/host-hostname:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
        # Wird postgres neu erstellt (anderes Abbild, geaenderte Einstellung),
        # haelt Compose Backend und Worker vorher an und startet sie danach
        # wieder (Compose >= 2.17). Ihr Einstieg laeuft thinforge-migrate, der
        # nach einem Wechsel der C-Bibliothek die Indizes neu aufbaut, bevor
        # etwas schreibt (crates/thinforge-migrate/src/collation.rs) — ohne
        # die Zeile schrieben die alten Prozesse nach einem `docker compose
        # up -d` weiter in falsch sortierte Indizes.
        restart: true
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  worker:
    labels:
      com.thinforge.label: "Worker"
      com.thinforge.icon: "mdi-cog-outline"
    <<: *no-search-domain
    image: git.thinforge.org/thinforge/thinforge-worker:release
    command: ["thinforge-worker"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD fehlt in .env — deploy.sh traegt sie nach}@redis:6379/0
      STORAGE_DIR: /data
      SIGNING_KEY_DIR: /data/keys
      # Parität zum Dev-Compose (Audit docker-compose.registry.yml:186):
      # der Worker aktiviert geplante Deployments — er braucht dieselben
      # Pfade wie das Backend (PXE/TFTP, dnsmasq, NFS-Config), sonst laufen
      # geplante Deployments im Release-Deployment anders/fehlerhaft als im Dev.
      TFTP_ROOT: /var/lib/tftpboot
      THINFORGE_ENABLED_PROFILES: ${THINFORGE_ENABLED_PROFILES:-}
      # Groesse des Worker-Pools (leer = Vorgabe 24/2, crates/thinforge-core/
      # src/config.rs); Summe mit der API gegen Postgres max_connections halten.
      WORKER_DB_MAX_CONNECTIONS: ${WORKER_DB_MAX_CONNECTIONS:-}
      WORKER_DB_MIN_CONNECTIONS: ${WORKER_DB_MIN_CONNECTIONS:-}
      # Bild-Kanal wie beim Backend: der Worker startet BitTorrent-Seeder und
      # Multicast-Sender mit der Abbild-Referenz aus der gemounteten
      # /docker-compose.yml (dienst_abbild.rs, seit 2026-10-20); hier fest
      # :release.
      THINFORGE_TAG: ${THINFORGE_TAG:-release}
    volumes:
      - ${STORAGE_DIR:-./ThinForgeDaten}:/data
      - ${STORAGE_DIR:-./ThinForgeDaten}/ssh:/data/ssh
      - ${STORAGE_DIR:-./ThinForgeDaten}/dnsmasq:/etc/dnsmasq.d
      - ${STORAGE_DIR:-./ThinForgeDaten}/tftp:/var/lib/tftpboot
      - ${STORAGE_DIR:-./ThinForgeDaten}/nfs-config:/data/nfs-config
      - ./agent-go/bin:/app/agent-go/bin:ro
      # Abonnementdatei (Lizenzmodell v2, VPN-Plaetze), nur lesend. Die
      # Platzgrenze prueft das Backend synchron im Request (handlers/vpn.rs →
      # vpn::enrollment::activate_client_with_seats, liest die Datei bei jeder
      # Aktivierung frisch). Der Worker braucht sie nur fuer den Restposten-Arm
      # Job::ActivateVpnClient (Auftragstyp vpn_activate, ueber
      # Auftragsvorlagen weiter zustellbar), der dieselbe Pruefung aufruft.
      # Geschrieben wird das Verzeichnis nur vom Backend (Upload, Entfernen,
      # Restore) — docs/architecture/licensing.md §4.
      - ./license:/app/license:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/docker-compose.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/worker-alive -mmin -1 2>/dev/null | grep -q . || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
        # wie beim Backend: vor einem neu erstellten postgres anhalten, danach
        # mit Migrator neu starten
        restart: true
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  frontend:
    labels:
      com.thinforge.label: "Frontend (Vue)"
      com.thinforge.icon: "mdi-web"
    <<: *no-search-domain
    image: git.thinforge.org/thinforge/thinforge-frontend:release
    restart: unless-stopped
    # Kein Volume: die App-Version entsteht beim Build (siehe
    # docker/frontend/Dockerfile); der bis 2026-10-01 eingehaengte
    # ./docs/CHANGELOG.md wurde zur Laufzeit von niemandem gelesen.
    ports:
      # Bind to 127.0.0.1 only — Caddy reverse-proxies frontend on :443.
      # See docs/security/security-audit-2026-04-18.md F-CR-06.
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    healthcheck:
      # exec-Form + statische Go-Probe (docker/frontend/Dockerfile, probe-Stage):
      # aus der Minimus-Zeit (distroless, ohne sh/wget); sie bleibt im
      # offiziellen Abbild.
      test: ["CMD", "/healthprobe", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging

  caddy:
    labels:
      com.thinforge.label: "Caddy (Proxy)"
      com.thinforge.icon: "mdi-shield-outline"
    <<: *no-search-domain
    # Offizielles Docker-Hub-Abbild (in der Dev-Compose bis 2026-10-26
    # reg.mini.dev/caddy:latest, Minimus, mit `user: "0"`; die Registry ist
    # abgeschaltet). Laeuft wie vorgegeben als root: Caddy bindet die
    # privilegierten :80/:443 unter network_mode:host und schreibt in die
    # root-eigenen Bind-Mounts (/data, /config).
    image: caddy:latest
    restart: unless-stopped
    # Reverse-Proxy fuer das Mgmt-Netz — gehoert zur Network-Gruppe im
    # Services-Panel. Wird per `rebuild.sh`/`deploy.sh` (--profile network)
    # gestartet; nichts depends_on caddy.
    profiles:
      - network
    # Host-Networking, damit Caddy auf <rollout_ip>:80 binden kann und
    # so das Mgmt-Netz nicht erreicht. Reverse-Proxies in der Caddyfile
    # zeigen auf 127.0.0.1:<port>, weil backend/frontend im host-Net
    # keine Service-DNS-Aufloesung mehr haben.
    network_mode: host
    volumes:
      - ${STORAGE_DIR:-./ThinForgeDaten}/caddy/Caddyfile:/etc/caddy/Caddyfile
      - ${STORAGE_DIR:-./ThinForgeDaten}/caddy/conf.d:/etc/caddy/conf.d
      - ${STORAGE_DIR:-./ThinForgeDaten}/caddy/data:/data
      - ${STORAGE_DIR:-./ThinForgeDaten}/caddy/config:/config
      - ${STORAGE_DIR:-./ThinForgeDaten}/caddy/certs:/etc/caddy/certs:ro
      - ${STORAGE_DIR:-./ThinForgeDaten}/tftp:/srv/tftp:ro
    healthcheck:
      # Die Admin-API auf 127.0.0.1:2019 laeuft immer, egal an welche Adressen
      # der Setup-Assistent die Listener bindet: :80/:443 liegen nur auf den
      # Listener-Adressen, nicht auf 127.0.0.1 (so auf .33, 2026-10-26).
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      - backend
      - frontend
    logging: *default-logging

  guacd:
    # Braucht den Anker so noetig wie sonst kein Dienst: guacd loest den
    # einteiligen Namen `backend` auf (ClientTarget.backend_service_name,
    # BACKEND_SERVICE_NAME ist nirgends gesetzt) und baut darauf die
    # VNC-Verbindung zum adressgeprueften Gate vor dem SSH-Tunnel
    # (remote_desktop/guacd_gate.rs, das seinerseits nur Verbindungen von
    # guacds Adresse annimmt). Ohne dns_search `.` haengt Dockers
    # DNS die search-domain des Hosts an, und eine Wildcard beantwortet
    # `backend.<domain>` mit einer externen Adresse — die Sitzung kaeme nie
    # zustande und guacd baute eine Verbindung nach draussen auf.
    <<: *no-search-domain
    image: guacamole/guacd:1.6.0
    container_name: thinforge-guacd
    restart: unless-stopped
    # Default compose bridge: backend reaches us by service-name DNS.
    labels:
      com.thinforge.label: "Guacd (Remote-Desktop)"
      com.thinforge.icon: "mdi-remote-desktop"
      # Explicit container_name above (no `-1` suffix) — override the
      # parser-default so inspect/logs/start/stop find the running container.
      com.thinforge.container_name: "thinforge-guacd"
    # Network-Infrastructure — laeuft nur mit `--profile network`
    # (deploy.sh/rebuild.sh setzen das Flag). backend hat bewusst KEIN
    # depends_on: guacd mehr (2026-05-22 entkoppelt) — Guacamole-Sessions
    # sind optional und sollen den Core-Start nicht blockieren.
    # Profile dient ausserdem der UI-Gruppierung im Services-Panel.
    profiles:
      - network
    # Kein Volume: ThinForge setzt keine `recording-*`-Parameter, guacd
    # zeichnet nichts auf. Der frueher eingebundene `guacd-recordings`-Ordner
    # blieb leer und war nur beschreibbare Host-Flaeche fuer einen
    # netzseitigen Dienst (entfernt 2026-09-30).
    environment:
      GUACD_LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "4822"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging: *default-logging

  dnsmasq:
    labels:
      com.thinforge.label: "dnsmasq (DHCP/PXE)"
      com.thinforge.icon: "mdi-lan"
    image: git.thinforge.org/thinforge/thinforge-dnsmasq:release
    # `always` statt `unless-stopped` — Begruendung siehe docker-compose.yml:
    # dnsmasq traegt DHCP+DNS des Rollout-LANs, ein Ausbleiben nach dem Boot
    # legt die gesamte Client-Flotte still. Der Entrypoint verhindert den
    # Start vor dem Setup-Wizard.
    restart: always
    profiles:
      - network
    cap_add:
      - NET_ADMIN
    network_mode: host
    volumes:
      - ${STORAGE_DIR:-./ThinForgeDaten}/dnsmasq:/etc/dnsmasq.d
      - ${STORAGE_DIR:-./ThinForgeDaten}/tftp:/var/lib/tftpboot
    environment:
      THINFORGE_BACKEND: http://127.0.0.1:8000
    healthcheck:
      # Prozess + Rollout-Interface-Existenz (siehe docker-compose.yml) —
      # Script ist im Image (docker/dnsmasq/healthcheck.sh, seit bind-dynamic).
      test: ["CMD", "/healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      - backend
    logging: *default-logging

  netbird:
    labels:
      com.thinforge.service: "thinvpn"
      com.thinforge.label: "ThinVPN"
      com.thinforge.icon: "mdi-vpn"
    # Offizielles Upstream-Image (docker compose pull = neueste Version).
    image: netbirdio/netbird:latest
    # Entrypoint-Override → idle Daemon; Backend enrollt per exec
    # (handlers::vpn::bootstrap_server_peer). Siehe docker-compose.yml.
    entrypoint: ["netbird"]
    command: ["service", "run"]
    restart: unless-stopped
    profiles:
      - network
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
    devices:
      - /dev/net/tun
    volumes:
      - ${STORAGE_DIR:-./ThinForgeDaten}/netbird-config:/var/lib/netbird
    healthcheck:
      test: ["CMD", "netbird", "status", "--check", "live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

  chrony:
    labels:
      com.thinforge.label: "Chrony (NTP)"
      com.thinforge.icon: "mdi-clock-outline"
    image: git.thinforge.org/thinforge/thinforge-chrony:release
    restart: unless-stopped
    profiles:
      - network
    cap_add:
      - SYS_TIME
    network_mode: host
    volumes:
      - ${STORAGE_DIR:-./ThinForgeDaten}/chrony:/etc/chrony/ntp.d
    healthcheck:
      test: ["CMD", "chronyc", "tracking"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - backend
    logging: *default-logging

  nfs-server:
    labels:
      com.thinforge.label: "NFS Server"
      com.thinforge.icon: "mdi-folder-network"
    image: git.thinforge.org/thinforge/thinforge-nfs-server:release
    restart: unless-stopped
    profiles:
      - network
    privileged: true
    network_mode: host
    volumes:
      - ${STORAGE_DIR:-./ThinForgeDaten}/clones:/nfs/clones
      - ${STORAGE_DIR:-./ThinForgeDaten}/captures:/nfs/captures
      # `deltas` ist seit T22 (2026-05-07) nicht mehr exportiert — Deltas gehen
      # ueber HTTPS (`/api/v1/agent/deltas/{file}`) raus. Der Mount ist deshalb
      # entfallen (2026-09-30).
      # Das ganze Verzeichnis, nicht die Datei (Runde 6, T143): das Backend
      # schreibt `exports` per tmp + rename, und ein Einzeldatei-Mount haengt am
      # Inode — `exportfs -ra` laese nach dem ersten rename fuer immer den alten
      # Stand. Der Entrypoint verlinkt /etc/exports auf die Datei hier drin.
      - ${STORAGE_DIR:-./ThinForgeDaten}/nfs-config:/etc/thinforge-nfs:ro
    healthcheck:
      test: ["CMD-SHELL", "rpcinfo -t localhost 100003 3 2>/dev/null || rpcinfo -p localhost 2>/dev/null | grep -q nfs"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - backend
    logging: *default-logging

