#     depends_on:
#       - backend

  multicast-sender:
    # Image-Source + UI-Metadata. Echte Sender-Container werden pro
    # aktivem Deployment dynamisch als `thinforge-mc-sender-<dep_short>`
    # gestartet (DYNAMIC_PATTERNS in docker_service.rs); diese tauchen
    # zusätzlich als eigene Zeilen im Services-Panel auf. Der Template-
    # Eintrag bleibt als idle-Platzhalter unter den On-Demand-Diensten.
    labels:
      com.thinforge.label: "Multicast-Sender"
      com.thinforge.icon: "mdi-multicast"
      com.thinforge.on_demand: "true"
    image: git.example.com/thinforge/thinforge-multicast-sender:latest
    profiles:
      - multicast
    network_mode: host

  bt-seeder:
    # Compose-Entry ist nur Image-Source + UI-Metadata. Der eigentliche
    # Container wird vom Backend (`bittorrent_service::ensure_seeder_running`)
    # mit festem Namen `thinforge-bt-seeder-service` gestartet — daher
    # der explizite container_name-Override, damit das Services-Panel den
    # laufenden Container findet (statt den unbenutzten `-1`-Default).
    labels:
      com.thinforge.label: "BitTorrent-Seeder"
      com.thinforge.icon: "mdi-progress-download"
      com.thinforge.on_demand: "true"
      com.thinforge.container_name: "thinforge-bt-seeder-service"
    image: git.example.com/thinforge/thinforge-bt-seeder:latest
    profiles:
      - bittorrent
    network_mode: host

  cloner:
    labels:
      com.thinforge.label: "Cloner (Clonezilla)"
      com.thinforge.icon: "mdi-content-duplicate"
      com.thinforge.on_demand: "true"
    image: git.example.com/thinforge/thinforge-cloner:latest
    profiles:
      - cloner
    privileged: true
    volumes:
      - ${STORAGE_DIR:-./ThinForgeDaten}/cloning-vm:/input:ro
      - ${STORAGE_DIR:-./ThinForgeDaten}/clones:/output
    command: ["echo", "Use 'docker run' to execute cloning operations"]

  cloning-vm:
    labels:
      com.thinforge.label: "Cloning-VM (QEMU)"
      com.thinforge.icon: "mdi-desktop-classic"
      com.thinforge.on_demand: "true"
    image: git.example.com/thinforge/thinforge-cloning-vm:latest
    restart: "no"
    profiles:
      - testing
    privileged: true
    network_mode: host
    mem_limit: ${CLONING_VM_MEM_LIMIT:-2560m}
    volumes:
      - ${STORAGE_DIR:-./ThinForgeDaten}/cloning-vm:/var/lib/thinforge/cloning-vm
      - ${STORAGE_DIR:-./ThinForgeDaten}/isos:/var/lib/thinforge/isos:ro
      - ./scripts:/var/lib/thinforge/scripts:ro
    environment:
      - VM_RAM=${CLONING_VM_RAM:-2048}
      - VM_CPUS=${CLONING_VM_CPUS:-2}
      - DISK_SIZE=${CLONING_VM_DISK_SIZE:-60G}
      - ISO_PATH=${CLONING_VM_ISO_PATH:-}
      - KVM_ENABLED=${CLONING_VM_KVM_ENABLED:-true}
    depends_on:
      - backend

volumes:
  acceptance_cache:
