---
- name: Sync TLS Certificate to clients
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Fetch current TLS certificate from server
      ansible.builtin.uri:
        url: "http://backend:8000/api/v1/klon/tls-cert"
        return_content: true
      register: cert_response
      delegate_to: localhost
      run_once: true

    - name: Deploy TLS certificate to system trust store
      ansible.builtin.copy:
        content: "{{ cert_response.content }}"
        dest: /etc/ca-certificates/trust-source/anchors/thinforge-server.crt
        owner: root
        group: root
        mode: "0644"

    - name: Update system CA trust
      ansible.builtin.command: update-ca-trust
      changed_when: true

    - name: Restart ThinForge Agent
      ansible.builtin.systemd:
        name: thinforge-agent
        state: restarted
