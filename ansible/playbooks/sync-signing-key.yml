---
- name: Sync Minisign Public Key to clients
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Fetch current signing public key from server
      ansible.builtin.uri:
        url: "http://backend:8000/api/v1/klon/signing-key"
        return_content: true
      register: key_response
      delegate_to: localhost
      run_once: true

    - name: Deploy signing public key
      ansible.builtin.copy:
        content: "{{ key_response.content }}"
        dest: /data/thinforge/signing.pub
        owner: root
        group: root
        mode: "0644"

    - name: Restart ThinForge Agent
      ansible.builtin.systemd:
        name: thinforge-agent
        state: restarted
